<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sevC={critical:'var(--cr)',high:'var(--hi)',medium:'var(--me)',low:'var(--lo)'},W={critical:40,high:25,medium:12,low:5},sleep=ms=>new Promise(r=>setTimeout(r,ms));
const sv=s=>`<span class="sv" style="--c:${sevC[s]}">${s}</span>`,DEMO='<span class="lab">DEMO DATA</span>';

const G={};
function pick(id,items,fields){G[id]={items,fields};return `<div>${items.map((x,i)=>`<button class="chip${i?'':' on'}" onclick="sel('${id}',${i},this)">${x.t}</button>`).join('')}</div><div class="det" id="d-${id}">${det(id,0)}</div>`}
function det(id,i){const g=G[id],x=g.items[i];return `<h3>${x.t}</h3>`+g.fields.map(f=>`<p><b>${f[0]}:</b> ${x[f[1]]}</p>`).join('')}
function sel(id,i,b){b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');$('#d-'+id).innerHTML=det(id,i)}
const PROB=[{t:'Rule sprawl',e:'Old rules pile up and start to conflict. Rules run in order, so one broad rule can cancel a careful policy.',i:'Hidden open paths; nobody knows what the policy really allows.',s:'Parses rules to one format and detects contradicting, duplicate and any-any rules.'},
{t:'Unpatched software',e:'Known CVEs stay open; nobody owns patching.',i:'Attackers use public, well-documented flaws.',s:'Matches software to public CVE data (NVD, CISA KEV, FIRST EPSS) and flags unsupported versions.'},
{t:'Expiring certificates',e:'Weak or expired certs go unnoticed.',i:'Outages, browser warnings, weak encryption.',s:'Checks certificate expiry, weak encryption and HTTPS.'},
{t:'Unwatched logins',e:'Odd activity is never reviewed.',i:'Brute force or insider misuse goes unseen.',s:'Flags failed-login bursts and odd-hour logins; insider-weakness checks.'},
{t:'Chatbot pasting',e:'Small teams paste configs into public AI chatbots — a data leak waiting to happen.',i:'Sensitive network details leave the organisation.',s:'Analysis stays local; only small, pseudonymised snippets may go to an AI service.'}];
const OBJ=['Parse iptables, pfSense and Cisco ASA into one format','Detect contradicting, duplicate and any-any rules','Match software to public CVE data; flag unsupported versions','Check certificate expiry, weak encryption and HTTPS','Correlate findings by host; score Zero Trust compliance','Rank host risk locally (Random Forest); flag insider weaknesses'].map((t,i)=>({t:'Objective '+(i+1),e:t,s:['Normalise layer','Firewall audit module','Patch / vulnerability module','Certificate module','Correlation + Zero Trust','Risk prediction + insider checks'][i]}));
const FEAT=[{t:'Cross-module correlation',e:'Any-any rule + outdated Apache on the same host = Critical.',s:'Try it: Dashboard → Hosts & risk.'},{t:'Zero Trust score',e:'Per-principle breakdown with fixes.',s:'Dashboard → Hosts & risk (computed from active findings).'},{t:'Local Random Forest',e:'Ranks hosts; what-if view shows fix impact.',s:'<span class="lab">Not trained yet</span> — the prototype shows a clearly labelled rule-based placeholder score.'},{t:'Insider weakness checks',e:'Excess access, dormant accounts, odd logins.',s:'Prototype demonstrates odd-hour login and failed-login checks only.'},{t:'Privacy-first AI',e:'Only small, pseudonymised snippets leave.',s:'Prototype uses prewritten local explanations; no AI call is made.'}];
const NODES=[{k:'Upload',ic:'⇪',p:'Accept the files to audit.',i:'Firewall config, software list, domains, logs',o:'Raw inputs on the local server',t:'Web UI (HTML/CSS/JS), Python back end',r:'Entry point. Runs locally on the company server (Docker).',d:'iptables: -A INPUT -d 10.0.1.10 -j ACCEPT',l:'Local'},
{k:'Normalise',ic:'⇄',p:'Turn each vendor format into one common rule structure.',i:'iptables, pfSense, Cisco ASA configs',o:'Common internal rules',t:'Python; one parser per format',r:'Lets every audit run on the same rule shape.',d:'R4 {src:any, dst:10.0.1.10, port:any, ACCEPT}',l:'Local'},
{k:'Audit',ic:'🔍',p:'Run independent checks.',i:'Common rules, software, certificates, logs',o:'Findings in a shared format',t:'Python, pandas; NVD / CISA KEV / EPSS data',r:'Firewall, patch, certificate, log, Zero Trust and insider checks.',d:'R4 any-any (High) · Apache 2.4.49 (High)',l:'Local'},
{k:'Correlate & predict',ic:'🧠',p:'Join findings by host; rank risk.',i:'All findings',o:'Host risk ranking',t:'scikit-learn Random Forest (planned), pandas, SQLite/PostgreSQL',r:'Where combined risk is discovered.',d:'web-01: any-any + outdated Apache → CRITICAL',l:'Local'},
{k:'Explain',ic:'💬',p:'Turn each finding into a plain-language fix.',i:'Finding snippets (pseudonymised)',o:'Plain explanation + suggested fix',t:'AI language-model service (snippets only)',r:'The only step that may send data out — small pseudonymised snippets.',d:'snippet: "host-A: any-any rule + outdated web server"',l:'Snippets only'},
{k:'Report',ic:'📊',p:'Present results to the admin.',i:'Findings, scores, explanations',o:'Dashboard, scores, host graph, cleaned file',t:'HTML/CSS/JS, Docker',r:'For the admin.',d:'Report ready: 1 Critical, hosts ranked',l:'Local'}];
const TECH=[['Python','Back end'],['JavaScript','Front end'],['HTML','Front end'],['CSS','Front end'],['scikit-learn','Random Forest'],['pandas','Data analysis'],['SQLite','Dev database'],['PostgreSQL','RDBMS'],['Docker','Deployment'],['Git','Version control'],['GitHub','Collaboration'],['VS Code','Editor']];
const MAT=[['Tufin / AlgoSec / FireMon',1,0,0,0,0,'Very high','Enterprise-run'],['Tenable / Qualys',0,1,0,0,0,'Very high','Enterprise-run'],['Splunk (SIEM)',0,0,0,1,0,'Extreme','Enterprise-run'],['SSL Labs',0,0,1,0,0,'Free','Public web tool'],['RAT (academic)',1,0,0,0,0,'Free, dated','Local, no AI'],['Our tool',1,1,1,1,1,'Affordable','Local + tiny AI snippets']];
const MH=['Firewall rules','Patch / vulns','Cert health','Log anomalies','Explains simply','Cost','Data privacy'];
const mk=b=>b?'<span class="ok">✓</span>':'<span class="no">✕</span>';
const SL=[
{t:'Overview',n:'Introduce the project: one low-cost, self-hosted tool that audits firewall rules, patches, certificates and logs, correlates them and explains in plain language. This is a proposal; the dashboard is a prototype.',h:()=>`<div class="hero"><p class="mu">Final Year Project · Fall 2026 · Group 23 · IoBM</p><h1>AI-Assisted Firewall Rule Auditor</h1><p class="mu">A tool that checks messy firewall rules and explains the problems in simple language</p>
<svg viewBox="0 0 520 200" style="max-width:560px;width:100%"><g stroke="#22d3ee" fill="none" class="fl"><path d="M110 40L260 100M110 160L260 100M410 40L260 100M410 160L260 100"/></g><circle cx="260" cy="100" r="34" fill="#16203f" stroke="#8b5cf6"/><text x="260" y="104" fill="#e6ebff" text-anchor="middle" font-size="12">Correlate</text>${[['Firewall',110,40],['Patch / CVE',110,160],['Certificates',410,40],['Logs',410,160]].map(a=>`<rect x="${a[1]-50}" y="${a[2]-17}" width="100" height="34" rx="8" fill="#0f1730" stroke="#3b82f6"/><text x="${a[1]}" y="${a[2]+4}" fill="#e6ebff" text-anchor="middle" font-size="12">${a[0]}</text>`).join('')}</svg>
<p>Elisha Tejani (20231-33955) · Ainab Shaikh (20231-33757) · Parth Maheshwari (20231-33920)<br>Supervisor: Sir Salman Akbar</p><button class="btn pr" onclick="go(1)">Explore Proposal</button> <button class="btn" onclick="mode('d')">Launch Dashboard Demo</button></div>`},
{t:'Problem & Rationale',n:'Click each problem. End on the privacy risk: small teams paste configs into public chatbots.',h:()=>`<h2>Problem Identification & Rationale</h2><p class="mu">Select a problem.</p>${pick('pr',PROB,[['What happens','e'],['Impact','i'],['How we address it','s']])}`},
{t:'Background & Context',n:'Three ideas: set-once-forgotten, risk lives in public data, tools built for big teams.',h:()=>`<h2>Background & Context</h2><div class="g3"><div class="c"><h3>Set once, forgotten</h3><p>Rules run in order, so one broad rule can cancel a careful policy.</p></div><div class="c"><h3>Risk lives in public data</h3><p>CVEs, support status, certificate validity and log patterns.</p></div><div class="c"><h3>Tools built for big teams</h3><p>Tufin, Tenable and Splunk assume budget and security experts.</p></div></div><div class="c" style="margin-top:14px"><h3>Why it matters now</h3><p>Small teams face enterprise threats with no security staff. Admins paste sensitive configs into public chatbots. Zero trust: no implicit trust inside the network.</p></div>`},
{t:'Problem Statement',n:'Read the gap, then walk the four rows.',h:()=>`<h2>Problem Statement</h2><div class="c" style="border-color:var(--cy)"><h3>The gap</h3>Small IT teams have no affordable, privacy-friendly, beginner-friendly tool that audits firewall rules, patches, certificates and logs together, and explains the results in plain language.</div><table style="margin-top:14px"><tr><th>Existing challenge</th><th>Proposed approach</th></tr><tr><td>Priced for enterprises — up to four separate subscriptions</td><td>One low-cost, self-hosted tool</td></tr><tr><td>One tool, one problem — nothing links findings</td><td>Cross-module correlation by host</td></tr><tr><td>Written for experts — no plain explanations</td><td>Plain-language explanations and fixes</td></tr><tr><td>Privacy trade-offs — public web tools or chatbot pasting</td><td>Local analysis; only small pseudonymised snippets</td></tr></table>`},
{t:'Objectives',n:'General objective, then the six specific objectives.',h:()=>`<h2>Project Objectives</h2><p class="c">Build one low-cost, self-hosted web tool that audits and correlates security findings, and explains them to non-experts.</p>${pick('ob',OBJ,[['Objective','e'],['Delivered by','s']])}`},
{t:'Scope & Future Scope',n:'Only the left column is the project. The right column is NOT implemented.',h:()=>`<h2>Scope & Future Scope</h2><div class="g2"><div class="c" style="border-color:var(--lo)"><h3 class="ok">✓ In scope (this project)</h3><p>✓ Firewall, patch, certificate and log audits<br>✓ Cross-module correlation and one health score<br>✓ Zero Trust score and local Random Forest ranking<br>✓ Plain-language AI fixes, cleaned file, report<br>✓ Self-hosted web app delivered with Docker</p></div><div class="c" style="border-style:dashed"><h3 style="color:var(--pu)">+ Future scope (not implemented)</h3><p>+ Run on physical firewall hardware and appliances<br>+ More vendors: Fortinet, Palo Alto, cloud security groups<br>+ Real-time monitoring; apply approved fixes automatically<br>+ Train on real labelled breach data for stronger predictions<br>+ Compliance reports and multi-site management</p></div></div>`},
{t:'Existing Solutions',n:'Four categories; each covers one slice.',h:()=>`<h2>Existing Solutions</h2><div class="g4">${[['Firewall policy','Tufin, AlgoSec, FireMon, RAT','Enterprise-priced, or free but outdated'],['Vulnerabilities','Tenable, Qualys','Separate, costly products that assume an analyst'],['Logs / SIEM','Splunk, Wazuh','Powerful but complex; needs training'],['Certificates','SSL Labs','Technical and not linked to other checks']].map(x=>`<div class="c"><h3>${x[0]}</h3><b>${x[1]}</b><p class="mu">${x[2]}</p></div>`).join('')}</div><p class="mu">Research foundations: Al-Shaer & Hamed · NIST SP 800-41 and 800-207 · CERT insider-threat guide · FIRST EPSS</p>`},
{t:'Limitation Matrix',n:'This is the comparison from our research. Click a column header to highlight it.',h:()=>`<h2>Limitation Matrix</h2><p class="mu">Comparison as presented in our research. Click a column.</p><table id="mt"><tr><th>Tool</th>${MH.map((h,i)=>`<th><button class="chip" onclick="hl(${i+1})">${h}</button></th>`).join('')}</tr>${MAT.map(r=>`<tr><td><b>${r[0]}</b></td>${r.slice(1,6).map(mk).map((v,i)=>`<td data-c="${i+1}">${v}</td>`).join('')}<td data-c="6">${r[6]}</td><td data-c="7">${r[7]}</td></tr>`).join('')}</table><p>Only our tool correlates findings across modules and works at a price small teams can afford.</p>`},
{t:'System Architecture',n:'Under two minutes: click Run Workflow. Data enters, is normalised, audited, correlated, explained, reported. Point at the scenario: any-any + outdated Apache = Critical. Only the Explain step may send small pseudonymised snippets out.',h:()=>`<h2>Proposed System Architecture</h2><p class="mu">Runs locally on the company server (Docker). Click a stage, or run the workflow.</p><div class="flow">${NODES.map((n,i)=>`${i?'<span class="ar">▶</span>':''}<button class="node" id="nd${i}" onclick="pickN(${i})"><div class="big-n">${n.ic}</div><b>${n.k}</b><div class="${n.l=='Local'?'ok':''}" style="font-size:.8em;color:${n.l=='Local'?'':'var(--me)'}">${n.l=='Local'?'Local':'Snippets only'}</div></button>`).join('')}</div>
<div style="margin:12px 0"><button class="btn pr" onclick="runWF()">▶ Run Workflow</button> <span class="lab">Illustrative data</span></div><div class="pkt" id="pk">Packet: —</div><div class="det" id="an"></div>
<div class="c" style="margin-top:12px;border-color:var(--hi)"><b>Scenario:</b> the Audit layer emits <i>R4 any-any</i> and <i>Apache 2.4.49</i> for host web-01. Correlation joins them by host → each is High alone, <b style="color:var(--cr)">Critical together</b>: a realistic way in.</div>`},
{t:'Key Features',n:'Five innovations. The dashboard shows the correlation live.',h:()=>`<h2>Key Features & Innovations</h2>${pick('ft',FEAT,[['What','e'],['In the prototype','s']])}<p><button class="btn pr" onclick="mode('d')">Open dashboard demo</button></p><p class="mu">Planned dashboard shown by the dashboard demo (concept prototype).</p>`},
{t:'Development Approach',n:'Agile sprints; modular OOP; privacy by design.',h:()=>`<h2>Development Approach</h2><div class="flow">${[['Core modules','Firewall, patch, certificate, log: one sprint each'],['Zero Trust + insider','Scoring and insider-weakness checks'],['Random Forest','Prepare data, train, then test on unseen data'],['Correlate + AI','Join findings by host; AI explanations'],['Dashboard','Colour-coded dashboard, host graph, report'],['Docker','Package for easy self-hosting']].map((x,i)=>`<div class="node" style="text-align:left"><b>Sprint ${i+1}: ${x[0]}</b><p class="mu">${x[1]}</p></div>`).join('')}</div><div class="g3" style="margin-top:14px"><div class="c"><h3>Agile sprints</h3>Short iterations; each module built and tested on its own.</div><div class="c"><h3>Modular OOP</h3>Independent audit modules, one parser per format, shared findings format.</div><div class="c"><h3>Privacy by design</h3>Analysis stays local; user IDs pseudonymised before any AI snippet.</div></div>`},
{t:'Tech Stack',n:'Proposed stack. NVD, CISA KEV and EPSS are external data sources.',h:()=>`<h2>Tools & Technology Stack</h2><div class="g4">${TECH.map(x=>`<div class="c"><b>${x[0]}</b><div class="mu">${x[1]}</div></div>`).join('')}</div><div class="c" style="margin-top:14px"><b>External data:</b> NVD CVE database · CISA KEV · FIRST EPSS · AI language-model service (snippets only)</div>`},

const rep=()=>{const a=act(),by=s=>a.filter(f=>f.sev==s);return `<h1>Firewall Rule Auditor — Audit Report</h1><p><b>SIMULATED DEMONSTRATION RESULTS on synthetic data.</b> Group 23, IoBM. Source: ${esc(S.src)}.</p><h2>Summary</h2><p>${a.length} active findings across ${HOSTS.length} hosts and ${S.rules.length} rules; Zero Trust score ${ztS()}% (illustrative).</p>`+['critical','high','medium','low'].map(s=>`<h2>${s[0].toUpperCase()+s.slice(1)} (${by(s).length})</h2>`+by(s).map(f=>`<p><b>${esc(f.title)}</b> (host ${f.host}, ${f.mod})<br>${f.plain}<br><i>Fix:</i> ${esc(f.fix)}</p>`).join('')).join('')+'<h2>Affected hosts (illustrative risk)</h2>'+HOSTS.map(h=>`<p>${h}: ${score(h,a)}</p>`).join('')};
function rp(){return `<h2>Report</h2><p><button class="btn pr" onclick="dl('html')">Download HTML report</button> <button class="btn" onclick="dl('csv')">Export CSV</button> <button class="btn" onclick="prt()">Print / save PDF</button></p><div class="c" style="background:#fff;color:#111">${rep()}</div>`}
function blobDl(n,t,m){const u=URL.createObjectURL(new Blob([t],{type:m})),a=document.createElement('a');a.href=u;a.download=n;a.click()}
function dl(k){if(k=='csv')blobDl('audit-findings.csv','id,host,module,severity,title,fix\n'+act().map(f=>[f.id,f.host,f.mod,f.sev,f.title,f.fix].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');else blobDl('audit-report.html','<meta charset=utf-8><body style="font-family:sans-serif;max-width:800px;margin:auto">'+rep(),'text/html')}
function prt(){const w=window.open('','_blank');if(!w){dl('html');return}w.document.write('<meta charset=utf-8><body style="font-family:sans-serif">'+rep());w.document.close();w.print()}
const STEPS=[['Load sample security data','Say: "We load synthetic firewall, software, certificate and log data."'],['Normalise firewall rules','Say: "Each vendor format becomes one common rule structure."'],['Run firewall, vulnerability, certificate and log checks','Say: "Independent audit modules run; vulnerability records here are illustrative offline records."'],['Correlate findings by host','Say: "The same host appears in several modules — we join them."'],['Rank hosts by illustrative risk','Say: "This is a rule-based placeholder; the Random Forest is a planned component."'],['Plain-language explanation','Say: "Every finding gets a simple explanation (prewritten demo engine)."'],['Recommended fixes','Say: "Fixes are suggestions; applying one in the demo is simulated."'],['Generate audit report','Say: "Open Report to export CSV or HTML."']];
async function runGuided(){$('#md').classList.add('o');if(!S.txt)S.txt=SAMPLE_FW;if(!S.src)S.src='built-in sample';for(let i=0;i<=STEPS.length;i++){$('#ms').innerHTML=STEPS.map((s,j)=>`<div class="st ${j<i?'d':j==i?'r':''}">${j<i?'✓':j==i?'▶':'○'} ${s[0]}</div>`).join('');if(i<STEPS.length){$('#mp').textContent=STEPS[i][1];if(i==2)runAudit(S.txt);await sleep(900)}}const a=act();$('#mp').textContent=`Done (simulated): ${a.length} findings — ${a.filter(f=>f.sev=='critical').length} critical, ${a.filter(f=>f.sev=='high').length} high.`}
